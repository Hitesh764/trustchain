services:
  - type: web
    name: trustchain-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: SEPOLIA_RPC_URL
        sync: false
      - key: OPERATOR_PRIVATE_KEY
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
